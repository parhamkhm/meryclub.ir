# nginx config for the meryclub-frontend container.
#
# Mirrors the routing the site's bare-metal nginx config used to do (see
# README.md's "Deployment" section): static files from this container's own
# filesystem, /api and /club-admin proxied to the backend container, /comments
# as a dedicated static route.
#
# TLS certs and the certbot ACME webroot are NOT baked into this image — they
# are bind-mounted read-only from the host at container start (see
# docker-compose.yml), so host-side certbot renewal keeps working unchanged.
# The two `include`/`ssl_dhparam` lines below assume certbot created
# /etc/letsencrypt/options-ssl-nginx.conf and /etc/letsencrypt/ssl-dhparam.pem
# on the host (it does by default with `certbot --nginx` or `certbot certonly
# --nginx`) — verify these paths exist on the server during the inspection
# step and adjust/remove if this host's certbot didn't create them.

server {
    listen 80;
    listen [::]:80;
    server_name meryclub.ir www.meryclub.ir;

    # Let certbot's webroot renewal keep working: this directory is
    # bind-mounted from the host's certbot webroot (e.g. /var/www/certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meryclub.ir www.meryclub.ir;

    ssl_certificate     /etc/letsencrypt/live/meryclub.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meryclub.ir/privkey.pem;
    include              /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam          /etc/letsencrypt/ssl-dhparam.pem;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- /comments — static page, not proxied to the backend -------------
    location = /comments/ {
        return 301 /comments;
    }

    location = /comments {
        try_files /comments/index.html =404;
    }

    # ---- backend: admin panel ---------------------------------------------
    location = /club-admin {
        return 301 /club-admin/;
    }

    location /club-admin/ {
        proxy_pass http://backend:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- backend: API -------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- static assets — cache policy matches the previous bare-metal setup
    location ~* ^/assets/(css|js)/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf|jpg|jpeg|png|webp|gif|ico|svg|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
